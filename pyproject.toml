[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbmc-sml-project"
version = "0.1.0"
description = "PBMC single-cell RNA-seq dimensionality reduction and clustering comparison for a statistical machine learning final project."
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scanpy>=1.10",
  "anndata>=0.10",
  "umap-learn>=0.5",
  "networkx>=3.0",
  "tabulate>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
